{% load static %}
<!-- ===== PREMIUM FLOATING ACTION BUTTONS ===== -->
<style>
    .floating-socials {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }
    .floating-fab {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        text-decoration: none;
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        position: relative;
        overflow: visible;
    }
    .floating-fab:hover {
        transform: translateY(-5px) scale(1.08);
        box-shadow: 0 14px 32px rgba(0,0,0,0.32);
    }
    .floating-fab img {
        width: 100%; height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }
    /* Tooltip */
    .floating-fab::after {
        content: attr(data-tooltip);
        position: absolute;
        right: 66px;
        background: rgba(20,10,5,0.85);
        color: #e8c47a;
        font-family: 'Poppins', sans-serif;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 8px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        backdrop-filter: blur(6px);
    }
    .floating-fab:hover::after { opacity: 1; }
    /* Pulse ring for WhatsApp */
    .floating-whatsapp {
        background: #25D366;
    }
    .floating-whatsapp::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid rgba(37,211,102,0.4);
        animation: wa-pulse 2.5s ease-out infinite;
    }
    @keyframes wa-pulse {
        0%   { transform: scale(1); opacity: 0.8; }
        70%  { transform: scale(1.4); opacity: 0; }
        100% { opacity: 0; }
    }
    .floating-instagram {
        background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }
    @media (max-width: 480px) {
        .floating-socials { right: 14px; bottom: 14px; gap: 10px; }
        .floating-fab { width: 50px; height: 50px; }
        .floating-fab::after { display: none; }
    }
</style>

<div class="floating-socials" aria-label="Quick contact">
    <a class="floating-fab floating-instagram"
       href="https://www.instagram.com/vijayalakshmi_silks_kpm/"
       target="_blank" rel="noopener noreferrer"
       aria-label="Follow us on Instagram"
       data-tooltip="Instagram">
        <i class="fa-brands fa-instagram" style="font-size: 26px; color: #fff;"></i>
    </a>
    <a class="floating-fab floating-whatsapp"
       href="https://wa.me/{{ site_settings.whatsapp_number|cut:' '|cut:'+' }}?text=Hello!%20I'm%20interested%20in%20your%20saree%20collection"
       target="_blank" rel="noopener noreferrer"
       aria-label="Chat on WhatsApp"
       data-tooltip="WhatsApp Us">
        <i class="fa-brands fa-whatsapp" style="font-size: 30px; color: #fff;"></i>
    </a>
</div>
