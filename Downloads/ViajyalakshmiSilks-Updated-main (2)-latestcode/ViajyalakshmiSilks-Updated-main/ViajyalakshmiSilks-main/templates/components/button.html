{% if element == "a" %}
<a href="{{ href|default:'#' }}" class="{{ class_name }}" {% if disabled %}aria-disabled="true"{% endif %}>
    {% if icon %}<span class="button-icon">{{ icon }}</span>{% endif %} {{ text }}
</a>
{% else %}
<button type="{{ type|default:'button' }}" class="{{ class_name }}" {% if disabled %}disabled{% endif %}>
    {% if icon %}<span class="button-icon">{{ icon }}</span>{% endif %} {{ text }}
</button>
{% endif %}
